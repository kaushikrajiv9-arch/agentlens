[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlens"
version = "0.1.0"
description = "Audit trail, authorization, and anomaly detection for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "AgentLens", email = "hello@agentlens.dev" }]
keywords = ["ai", "agents", "governance", "audit", "compliance", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
agentlens = "agentlens.cli:main"

[project.urls]
Homepage = "https://github.com/kaushikrajiv9-arch/agentlens"
Issues   = "https://github.com/kaushikrajiv9-arch/agentlens/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentlens*"]
